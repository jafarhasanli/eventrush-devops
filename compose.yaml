
name: eventrush

services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://eventrush:local_dev_only@db:5432/eventrush
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 3

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: eventrush
      POSTGRES_USER: eventrush
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventrush -d eventrush"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
